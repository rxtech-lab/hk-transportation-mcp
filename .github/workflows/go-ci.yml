name: Go CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Build server
        run: go build ./cmd/server
      - name: Build sync
        run: go build ./cmd/sync
      - name: Test
        run: go test ./...

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: hk-transportation-mcp:latest
      - name: Build sync image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sync
          push: false
          tags: hk-transportation-mcp-sync:latest
