<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <g transform="translate(256,256)" fill="none" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bus body -->
    <rect x="-100" y="-80" width="200" height="150" rx="24" fill="white" fill-opacity="0.15" stroke="white"/>
    <!-- Windows -->
    <rect x="-70" y="-50" width="55" height="40" rx="8" fill="white" fill-opacity="0.3"/>
    <rect x="15" y="-50" width="55" height="40" rx="8" fill="white" fill-opacity="0.3"/>
    <!-- Wheels -->
    <circle cx="-55" cy="85" r="20" fill="white" fill-opacity="0.2" stroke="white"/>
    <circle cx="55" cy="85" r="20" fill="white" fill-opacity="0.2" stroke="white"/>
    <!-- Headlights -->
    <rect x="-85" y="30" width="25" height="15" rx="4" fill="white" fill-opacity="0.5"/>
    <rect x="60" y="30" width="25" height="15" rx="4" fill="white" fill-opacity="0.5"/>
  </g>
</svg>
